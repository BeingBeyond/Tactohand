# @package _global_
task: tactohand_wrench
seed: 42

# DexYCB-only ViT-B preset: single-dataset fitting variant of
# experiment=tactohand.  Architecture scales down with the data budget
# (dexycb is ~1/20 of the 23-dataset mixture); loss schedule, aligned-
# substep force head (output_substeps=1) and the GT-damped rollout stay
# identical so numbers remain comparable with the formal run's semantics.

model:
  wrench:
    backbone: vit_base_patch16_dinov3
    backbone_img_size: ${data.image_size}
    pretrained: true
    pretrained_path: ${oc.env:PRETRAINED_PATH,null}
    freeze_backbone: false
    gradient_checkpointing: false
    # Temporal fusion (same TemporalFeatureEncoder class, tuned for d=768):
    #   - 3 layers instead of ViT-L's 6.  Each layer is one round of global
    #     attention over the 32-token (3.2 s) window; layer 1 resolves
    #     single-frame ambiguity with adjacent context (loading rate, motion
    #     blur), layers 2-3 integrate grasp-state evolution over ~0.3-1 s.
    #     Six layers were sized for the 23-dataset mixture; on dexycb-only
    #     the extra ~21M params buy overfitting, not accuracy.
    #   - 12 heads x 64 head-dim: the canonical ViT-B attention geometry
    #     (matches the backbone's own heads), better conditioned than 8x96.
    #   - FFN stays 4*dim, norm_first stays: proven stable under bf16+DDP,
    #     and torch.compile + the temporal_fusion=false ablation path are
    #     untouched (no code change anywhere).
    #   - dropout stays 0.0 for comparability with the formal run; if
    #     train/val point-force diverges, raise model.wrench.dropout to 0.1
    #     before touching depth.
    temporal_layers: 3
    temporal_heads: 12
    temporal_fusion: true
    dropout: 0.0
    output_mode: vertex_force
    query_heads: 12
    # Query + auxiliary (contact/proximity/gate) heads share this depth
    # knob; kept at 2: the query head drives the 4668-dim force regression
    # and the heads scale with d^2 (768 here vs 1024 formal), so they are
    # no longer the parameter hot spot.
    query_layers: 2
    output_substeps: 1
    hands: 2
    predict_contact_proximity: true

loss:
  wrench:
    type: l2
    point_force_weight: 10.0
    wrench_force_weight: 0.0
    wrench_torque_weight: 0.0
    force_active_zero_split: true
    force_active_threshold_n: 0.05
    force_zero_weight: 0.1
    force_active_huber_delta_n: 0.05
    # CB weights are the pooled-v5 artifact (all datasets).  Dexycb-specific
    # counts would need scripts/dataset_maintenance/labels/build_force_statistics_v5.py
    # scoped to dexycb; the pooled weights are acceptable for fitting.
    force_statistics_path: core/resources/tactohand/force_statistics_v5.npz
    raw_local_mse: false
    point_force_clamp_n: 20.0
    wrench_force_clamp_n: 50.0
    wrench_torque_clamp_nm: 10.0
  rollout:
    implementation: compiled_substep
    graph_extra_body_slots: 0
    graph_flat_substep: false
    # GT-damped rollout (aligned substep predicted, GT replayed elsewhere).
    weight: 1.0e-4
    start_epoch: 3
    horizon_10hz: 4
    position_scale_m: 0.01
    rotation_scale_rad: 0.1
    position_weight: 1.0
    rotation_weight: 1.0
    joint_weight: 1.0
    warmup_epochs: 4
  contact_proximity:
    contact_weight: 1.0
    gate_weight: 0.25
    force_gate: true
    proximity_weight: 2.0
  haco:
    contact_data_path: null
    contact_means_path: null
    v_regressor_336_path: null
    v_regressor_84_path: null
    mano_faces_path: null
    j_regressor_path: null
    # Pooled conditional statistics; same caveat as force_statistics_path.
    contact_statistics_path: core/resources/tactohand/contact_statistics_v5.npz

training:
  strategy: ddp
  max_epochs: 1000
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
  check_val_every_n_epoch: 1
  optimizer:
    lr: 5.0e-5
    backbone_lr: 5.0e-5
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
  scheduler:
    name: cosine
    min_lr_ratio: 0.1
    warmup_epochs: 2
    warmup_steps: 10
  compile:
    enabled: true
    mode: default
    backend: auto
    fullgraph: false
    modules: [network.temporal, network.query_head]

metrics:
  rollout_integrator: implicit_midpoint
  implicit_iterations: 6
  rollout_horizons: [1, 2, 4, 8]
  rollout_subsets: [all, real_only, padding_only, boundary_crossing]
  train_max_batches: 0
  val_max_batches: null
  explosion_linear_speed_m_s: 100.0
  explosion_angular_speed_rad_s: 1000.0
  tensorboard_rollout_horizons: [4]
  tensorboard_rollout_metrics:
    - position_ade_m
    - rotation_ade_rad
    - explosion_rate

checkpoint:
  monitor: loss/val/point_force
  mode: min
  save_top_k: 1
  save_last: true
  filename: best_val_point_force-epoch={epoch:02d}
  additional_monitors:
    - monitor: loss/val/wrench_torque
      mode: min
      save_top_k: 1
      filename: best_val_wrench_torque-epoch={epoch:02d}
    - monitor: epoch/metrics/val/contact/f1
      mode: max
      save_top_k: 1
      filename: best_val_contact_f1-epoch={epoch:02d}
    - monitor: epoch/metrics/val/proximity/mae
      mode: min
      save_top_k: 1
      filename: best_val_proximity_mae-epoch={epoch:02d}

logging:
  log_every_n_steps: 1
  verbosity: normal
  console:
    progress_every_n_steps: 20
  tensorboard:
    enabled: true
    level: core
    scalar_every_n_steps: 1
    flush_secs: 10
  project: video2contact
  name: tactohand-dexycb-vitb
  device_stats:
    enabled: false
  visualization:
    enabled: false
  wandb:
    enabled: false
    log_model: false

profiling:
  enabled: false
  print_interval_steps: 100
  window_size: 50
  warmup_steps: 1
  sync_cuda: true
  log_to_logger: false

data:
  # DexYCB only.  point_force_scale auto-adapts: the datamodule recomputes
  # it from this train mix's label_stats (nonzero_rms), so the head scale is
  # dexycb-population even though the CB/VCB artifacts above are pooled.
  datasets: [dexycb]
  val_datasets: [dexycb]
  val_split_by_dataset:
    dexycb: test
  handcrop_datasets: []
  contact_only_datasets: []
  object_allowlist_file: null
  predict_both_hands: true
  proximity_tau: 20.0
  vertex_force_frame: vertex_local
  point_force_scale_source: rows_rms
