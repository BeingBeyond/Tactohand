# Inclusion only. Research sources stay in the workspace; this is not a
# deletion list and does not authorize publishing Git history or assets.
[wheel]
include = [
  "core/*.py",
  "core/data/*.py",
  "core/geometry/*.py",
  "core/io/*.py",
  "core/tactile_labels/*.py",
  "core/visualization/*.py",
  "core/resources/tactohand/*.npz",
  "core/resources/tactohand/manifest.json",
  "core/resources/tactohand/gigahands_tracking_good_objects.allowlist.json",
  "training/__init__.py",
  "training/cli.py",
  "training/train.py",
  "training/infer_tactohand.py",
  "training/eval_tactohand.py",
  "training/configs/*.py",
  "training/callbacks/*.py",
  "training/losses/__init__.py",
  "training/losses/haco_losses.py",
  "training/tactohand_wrench/*.py",
  "training/data/*.py",
  "training/runtime/*.py",
  "training/visualization/*.py",
  "training/visualization/inference_viewer.html",
  "training/tactohand_wrench/data/*.py",
  "training/tactohand_wrench/nn/*.py",
  "training/tactohand_wrench/runtime/*.py",
  "training/tactohand_wrench/validation/*.py",
  "training/tactohand_wrench/wrench/*.py",
  "training/evaluation/*.py",
  "training/conf/config.yaml",
  "training/conf/data/tactohand.yaml",
  "training/conf/experiment/tactohand.yaml",
  "training/conf/experiment/tactohand_384.yaml",
  "core/physics/*.py",
]
exclude = [
  "**/test_*.py",
  "training/tactohand_wrench/check_*.py",
  "training/evaluation/predictors_research.py",
  "training/evaluation/predictors_contactprompt.py",
  "training/evaluation/predictors_interfield.py",
  "training/evaluation/egophi_predictor.py",
]

[source]
include = [
  "assets/manifest.json",
  "assets/mano/corrected/provenance/*.json",
  "tools/checks/check_assets.py",
  "label_generation/*.py",
  "label_generation/adapters/*.py",
  "scripts/labels/*.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "setup.py",
  ".gitignore",
  "packaging/public_files.toml",
  "tools/packaging/public_source_scope.py",
  "tools/packaging/build_public_source.py",
  "tools/checks/check_distribution.py",
  "tools/checks/check_prediction.py",
  "tools/checks/check_resources.py",
  "scripts/training/run_experiment.sh",
  "docs/usage.md",
  "docs/datasets.md",
  "docs/labels_v5.md",
]
