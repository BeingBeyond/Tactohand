[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tactohand"
version = "0.1.0.dev0"
description = "TactoHand contact, proximity and force prediction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.10,<2.11",
    "torchvision>=0.25,<0.26",
    "timm>=1.0.25,<1.1",
    "safetensors>=0.4",
]

[project.optional-dependencies]
inference = ["omegaconf>=2.3,<2.4", "opencv-python-headless>=4.10"]
train = [
    "pytorch-lightning>=2.5",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "pyarrow>=18",
    "pandas>=2",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "msgpack>=1",
    "tensorboard>=2.18",
    "einops>=0.8",
    "tqdm>=4.66",
]
video = ["torchcodec>=0.10,<0.11"]
visualization = ["trimesh>=4", "pillow>=10", "matplotlib>=3.8"]
labels = ["pyarrow>=18", "pandas>=2", "scipy>=1.13", "trimesh>=4", "smplx>=0.1.28"]
dev = ["pyright>=1.1", "wheel"]

[project.scripts]
tactohand-train = "training.cli:train_main"
tactohand-eval = "training.eval_tactohand:main"
tactohand-infer = "training.infer_tactohand:main"
tactohand-view = "training.visualization.inference_viewer:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
core = ["resources/tactohand/*.npz", "resources/tactohand/*.json", "resources/tactohand/*.md"]
training = ["conf/*.yaml", "conf/data/*.yaml", "conf/experiment/*.yaml", "visualization/*.html"]
